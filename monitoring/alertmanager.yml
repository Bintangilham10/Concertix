global:
  resolve_timeout: 5m

route:
  receiver: local-demo
  group_by:
    - alertname
    - service
    - severity
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: local-demo

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - service
